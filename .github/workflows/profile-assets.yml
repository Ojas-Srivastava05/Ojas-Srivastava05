name: Profile assets

on:
  schedule:
    - cron: "30 */12 * * *"
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      recapture_portfolio:
        description: "Re-capture the portfolio tour screenshots"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-assets.yml"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#059669&color_dots=#ebedf0,#a7f3d0,#6ee7b7,#34d399,#059669
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#34D399&color_dots=#161b22,#064e3b,#047857,#10b981,#34d399

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 5.5

  readme-assets:
    needs: summary-cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Re-capture portfolio tour
        if: github.event.schedule == '0 3 * * 0' || inputs.recapture_portfolio
        run: |
          pip install --quiet playwright pillow
          python -m playwright install --with-deps chromium
          python scripts/portfolio_tour.py

      - name: Rebuild SVGs from live LeetCode / Codeforces data
        run: python scripts/build_assets.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          if git diff --cached --quiet; then
            echo "No asset changes."
            exit 0
          fi
          git commit -m "chore: refresh README assets from live data"
          git pull --rebase origin main
          git push origin HEAD:main
