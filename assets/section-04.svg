    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#34D399"/><stop offset=".55" stop-color="#22D3EE"/><stop offset="1" stop-color="#FBBF24"/></linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset=".55" stop-color="#A7F3D0"/><stop offset="1" stop-color="#FDE68A"/></linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity="0.06"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <clipPath id="clipAll"><rect width="1200" height="96" rx="24"/></clipPath>
    <radialGradient id="sg" cx=".5" cy=".5" r=".5"><stop stop-color="#34D399" stop-opacity="0.18"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/></radialGradient><linearGradient id="flowbar" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="560" y2="0" spreadMethod="repeat"><stop stop-color="#34D399"/><stop offset=".33" stop-color="#22D3EE"/><stop offset=".66" stop-color="#FBBF24"/><stop offset="1" stop-color="#34D399"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="560 0" dur="5s" repeatCount="indefinite"/></linearGradient><linearGradient id="comet" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".8" stop-color="#FFFFFF" stop-opacity=".75"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient><filter id="bglow" x="-5%" y="-400%" width="110%" height="900%"><feGaussianBlur stdDeviation="3.2"/></filter><filter id="cglow" x="-20%" y="-400%" width="140%" height="900%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="barclip"><rect x="40" y="68" width="1120" height="24"/></clipPath>
    <style>
      .fade { animation: fade .7s ease both; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      .dash { stroke-dasharray: 10 14; animation: dash 14s linear infinite; }
      .draw { stroke-dasharray: 1000; animation: draw 2.6s cubic-bezier(.4,0,.2,1) both; }
      .sweep { stroke-dasharray: 110 890; animation: sweep 7s linear infinite; }
      .scan { animation: scan 8s cubic-bezier(.6,0,.4,1) infinite; }
      @keyframes sweep { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
      @keyframes scan { 0% { transform: translateX(-420px); } 60%, 100% { transform: translateX(1620px); } }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes dash { to { stroke-dashoffset: -480; } }
      @keyframes draw { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
      .reveal { transform-box: fill-box; transform-origin: left; animation: reveal 1.4s cubic-bezier(.2,.8,.2,1) both; }@keyframes reveal { from { transform: scaleX(0); } }.breathe { animation: breathe 3.2s ease-in-out infinite; }@keyframes breathe { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }.comet { animation: comet 3.6s cubic-bezier(.45,0,.25,1) infinite; }@keyframes comet { from { transform: translateX(0); } to { transform: translateX(1340px); } }
    </style>
