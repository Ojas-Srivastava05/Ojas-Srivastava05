    <radialGradient id="fa" cx=".5" cy=".5" r=".5"><stop stop-color="#34D399" stop-opacity="0.2"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/></radialGradient><radialGradient id="fb" cx=".5" cy=".5" r=".5"><stop stop-color="#22D3EE" stop-opacity="0.14"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient><radialGradient id="fc" cx=".5" cy=".5" r=".5"><stop stop-color="#FBBF24" stop-opacity="0.1"/><stop offset="1" stop-color="#FBBF24" stop-opacity="0"/></radialGradient>
    <style>
      .fade { animation: fade .7s ease both; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      .dash { stroke-dasharray: 10 14; animation: dash 14s linear infinite; }
      .draw { stroke-dasharray: 1000; animation: draw 2.6s cubic-bezier(.4,0,.2,1) both; }
      .sweep { stroke-dasharray: 110 890; animation: sweep 7s linear infinite; }
      .scan { animation: scan 8s cubic-bezier(.6,0,.4,1) infinite; }
      @keyframes sweep { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
      @keyframes scan { 0% { transform: translateX(-420px); } 60%, 100% { transform: translateX(1620px); } }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes dash { to { stroke-dashoffset: -480; } }
      @keyframes draw { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
      
    </style>
