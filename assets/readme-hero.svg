    <style>
      .bg { fill: #08090C; }
      .mono { font-family: Consolas, Monaco, monospace; }
      .sans { font-family: Segoe UI, Arial, sans-serif; }
      .muted { fill: #71717A; }
      .soft { fill: #D4D4D8; }
      .emerald { fill: #34D399; }
      .amber { fill: #FDE68A; }
      .cyan { fill: #22D3EE; }
      .dash { stroke-dasharray: 12 18; animation: dash 9s linear infinite; }
      .dash2 { stroke-dasharray: 8 14; animation: dash 11s linear infinite reverse; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      .scan { animation: scan 5s ease-in-out infinite; }
      .blink { animation: blink 1s steps(2, start) infinite; }
      .ticker { animation: ticker 20s linear infinite; }
      .float { animation: float 4s ease-in-out infinite; }
      @keyframes dash { to { stroke-dashoffset: -240; } }
      @keyframes pulse { 0%,100% { opacity: .5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } }
      @keyframes scan { 0% { transform: translateX(-280px); opacity: 0; } 20%,70% { opacity: .65; } 100% { transform: translateX(1050px); opacity: 0; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-520px); } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
