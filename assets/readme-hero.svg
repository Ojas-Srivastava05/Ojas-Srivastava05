<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ojas Srivastava profile hero</title>
  <desc id="desc">Animated dark editorial GitHub profile banner for Ojas Srivastava, AI Engineer and Full-Stack Developer.</desc>
  <defs>
    <linearGradient id="heroText" x1="125" y1="95" x2="860" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.52" stop-color="#A7F3D0"/>
      <stop offset="1" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D399"/>
      <stop offset="0.55" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#FDE68A"/>
    </linearGradient>
    <radialGradient id="wash" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(920 150) rotate(135) scale(620 390)">
      <stop stop-color="#34D399" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#0EA5E9" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#08090C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.203 0 0 0 0 0.827 0 0 0 0 0.6 0 0 0 0.55 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .bg { fill: #08090C; }
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .display { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 850; letter-spacing: -0.02em; }
      .muted { fill: #71717A; }
      .soft { fill: #D4D4D8; }
      .white { fill: #FFFFFF; }
      .emerald { fill: #34D399; }
      .amber { fill: #FDE68A; }
      .dash { stroke-dasharray: 12 18; animation: dash 9s linear infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      .scan { animation: scan 4.6s ease-in-out infinite; }
      .blink { animation: blink 1s steps(2, start) infinite; }
      .ticker { animation: ticker 18s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -240; } }
      @keyframes pulse { 0%,100% { opacity: .46; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
      @keyframes scan { 0% { transform: translateX(-260px); opacity: 0; } 18%,70% { opacity: .7; } 100% { transform: translateX(980px); opacity: 0; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-520px); } }
    </style>
  </defs>

  <rect width="1200" height="560" rx="34" class="bg"/>
  <rect width="1200" height="560" rx="34" fill="url(#grid)"/>
  <rect width="1200" height="560" rx="34" fill="url(#wash)"/>

  <path class="dash" d="M64 402C230 304 356 420 520 322C694 218 780 74 1110 118" stroke="url(#accent)" stroke-opacity="0.42" stroke-width="2"/>
  <path class="dash" d="M88 112C218 174 346 128 472 174C642 236 748 386 1090 320" stroke="#34D399" stroke-opacity="0.18" stroke-width="2"/>
  <rect class="scan" x="65" y="55" width="180" height="430" rx="90" fill="url(#accent)" opacity="0.10"/>

  <g transform="translate(70 48)">
    <rect x="0" y="0" width="430" height="34" rx="10" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle class="pulse" cx="18" cy="17" r="5" fill="#34D399"/>
    <text x="34" y="22" class="mono emerald" font-size="11" font-weight="700">OPEN FOR SUMMER 2027 INTERNSHIP</text>
    <text x="268" y="22" class="mono muted" font-size="11">/ SDE / AI / FULL-STACK / SURAT, INDIA</text>
  </g>

  <g transform="translate(70 124)">
    <text x="0" y="0" class="mono muted" font-size="13" font-weight="700">// AI ENGINEER &amp; FULL-STACK DEVELOPER</text>
    <text x="0" y="72" class="display" font-size="66" fill="url(#heroText)">Ojas Srivastava</text>
    <text x="2" y="116" class="sans soft" font-size="23" font-weight="550">B.Tech AI at SVNIT Surat · CGPA 9.19</text>
    <text x="2" y="148" class="sans soft" font-size="23" font-weight="550">Backend systems, full-stack products, algorithm grind.</text>
    <text x="2" y="198" class="mono emerald" font-size="16" font-weight="700">Ship Clean Systems</text>
    <text x="178" y="198" class="mono muted" font-size="16">/ RAG / OCR / Route Intelligence / ML</text>
    <rect x="0" y="234" width="620" height="2" fill="url(#accent)" opacity="0.75"/>
    <text x="0" y="286" class="mono soft" font-size="18">Design Backend. Ship Product. Grind Algorithms.</text>
    <rect class="blink" x="478" y="269" width="11" height="24" fill="#34D399"/>
  </g>

  <g transform="translate(760 106)">
    <rect x="0" y="0" width="360" height="286" rx="24" fill="#0D1117" fill-opacity="0.94" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <rect x="18" y="18" width="324" height="38" rx="12" fill="#FFFFFF" fill-opacity="0.035"/>
    <circle cx="38" cy="37" r="5" fill="#EF4444"/>
    <circle cx="56" cy="37" r="5" fill="#F59E0B"/>
    <circle cx="74" cy="37" r="5" fill="#34D399"/>
    <text x="96" y="42" class="mono muted" font-size="11">engineer.config.ts</text>
    <text x="28" y="94" class="mono muted" font-size="14">const ojas = {</text>
    <text x="46" y="124" class="mono soft" font-size="14">rank: <tspan class="amber">"Knight"</tspan>,</text>
    <text x="46" y="154" class="mono soft" font-size="14">leetcode: <tspan class="emerald">548</tspan>,</text>
    <text x="46" y="184" class="mono soft" font-size="14">peak: <tspan class="emerald">1952</tspan>,</text>
    <text x="46" y="214" class="mono soft" font-size="14">aggregate: <tspan class="emerald">810+</tspan>,</text>
    <text x="46" y="244" class="mono soft" font-size="14">status: <tspan class="emerald">"available"</tspan></text>
    <text x="28" y="270" class="mono muted" font-size="14">}</text>
  </g>

  <g transform="translate(70 500)">
    <rect x="0" y="-22" width="1060" height="44" rx="14" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.07"/>
    <g class="ticker">
      <text x="24" y="6" class="mono soft" font-size="13" font-weight="700">LOGIFLOW</text>
      <text x="130" y="6" class="mono muted" font-size="13">Multi-Modal Logistics</text>
      <text x="338" y="6" class="mono soft" font-size="13" font-weight="700">AIRHELP</text>
      <text x="436" y="6" class="mono muted" font-size="13">Offline Airport AI</text>
      <text x="616" y="6" class="mono soft" font-size="13" font-weight="700">RANGRITI</text>
      <text x="730" y="6" class="mono muted" font-size="13">Cultural-Tech Platform</text>
      <text x="940" y="6" class="mono soft" font-size="13" font-weight="700">INK'D</text>
      <text x="1020" y="6" class="mono muted" font-size="13">AI Summariser</text>
      <text x="1160" y="6" class="mono soft" font-size="13" font-weight="700">LOGIFLOW</text>
      <text x="1266" y="6" class="mono muted" font-size="13">Multi-Modal Logistics</text>
      <text x="1474" y="6" class="mono soft" font-size="13" font-weight="700">AIRHELP</text>
      <text x="1572" y="6" class="mono muted" font-size="13">Offline Airport AI</text>
    </g>
  </g>
</svg>
