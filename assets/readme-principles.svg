  <text x="92" y="114" font-family="Segoe UI, Arial, sans-serif" fill="#FFFFFF" font-size="20" font-weight="700">Ship Clean Systems</text>
  <text x="92" y="142" font-family="Segoe UI, Arial, sans-serif" fill="#A1A1AA" font-size="16">Backend-first architecture with product surfaces that stay fast, reliable, and maintainable.</text>

  <rect x="52" y="162" width="1096" height="1" fill="#FFFFFF" fill-opacity="0.08"/>

  <circle cx="68" cy="198" r="6" fill="#22D3EE"/>
