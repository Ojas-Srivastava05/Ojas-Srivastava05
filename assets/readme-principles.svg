  <text x="600" y="62" text-anchor="middle" font-family="Consolas, Monaco, monospace" fill="#34D399" font-size="14" font-weight="700">// HOW I BUILD</text>
  <rect x="52" y="78" width="1096" height="1" fill="#FFFFFF" fill-opacity="0.08"/>

  <circle cx="68" cy="112" r="6" fill="#34D399"/>
  <text x="92" y="108" font-family="Segoe UI, Arial, sans-serif" fill="#FFFFFF" font-size="20" font-weight="700">Ship Clean Systems</text>
  <text x="92" y="136" font-family="Segoe UI, Arial, sans-serif" fill="#A1A1AA" font-size="15">Backend-first architecture with product surfaces that stay fast,</text>
  <text x="92" y="158" font-family="Segoe UI, Arial, sans-serif" fill="#A1A1AA" font-size="15">reliable, and maintainable.</text>
  <rect x="52" y="178" width="1096" height="1" fill="#FFFFFF" fill-opacity="0.08"/>

  <circle cx="68" cy="212" r="6" fill="#22D3EE"/>
  <text x="92" y="208" font-family="Segoe UI, Arial, sans-serif" fill="#FFFFFF" font-size="20" font-weight="700">AI With Intent</text>
  <text x="92" y="236" font-family="Segoe UI, Arial, sans-serif" fill="#A1A1AA" font-size="15">RAG, OCR, route intelligence, and ML pipelines only where they</text>
  <text x="92" y="258" font-family="Segoe UI, Arial, sans-serif" fill="#A1A1AA" font-size="15">earn their place in the product.</text>
  <rect x="52" y="278" width="1096" height="1" fill="#FFFFFF" fill-opacity="0.08"/>

  <circle cx="68" cy="312" r="6" fill="#FDE68A"/>
  <text x="92" y="308" font-family="Segoe UI, Arial, sans-serif" fill="#FFFFFF" font-size="20" font-weight="700">Algorithms Are Reps</text>
  <text x="92" y="336" font-family="Segoe UI, Arial, sans-serif" fill="#A1A1AA" font-size="15">Daily competitive programming discipline that sharpens debugging,</text>
  <text x="92" y="358" font-family="Segoe UI, Arial, sans-serif" fill="#A1A1AA" font-size="15">speed, and systems thinking.</text>

  <rect x="52" y="402" width="1096" height="4" rx="2" fill="url(#prAccent)"/>
