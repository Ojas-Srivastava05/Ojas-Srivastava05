<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="96" viewBox="0 0 1200 96" fill="none" role="img" aria-labelledby="t-section-01">
  <title id="t-section-01">01 — Highlights</title>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/">
      <rdf:Description dc:creator="Ojas Srivastava" dc:identifier="O5WS-7F3A9E2B1C4D" dc:source="https://github.com/Ojas-Srivastava05" dc:rights="Copyright 2026 Ojas Srivastava. Unauthorized copying prohibited."/>
    </rdf:RDF>
  </metadata>
  <!-- o5ws-integrity:section-01:7f3a9e2b1c4d -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity="0.04"/></pattern>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#34D399"/><stop offset=".55" stop-color="#22D3EE"/><stop offset="1" stop-color="#FBBF24"/></linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset=".55" stop-color="#A7F3D0"/><stop offset="1" stop-color="#FDE68A"/></linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity="0.06"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <clipPath id="clipAll"><rect width="1200" height="96" rx="24"/></clipPath>
    <radialGradient id="sg" cx=".5" cy=".5" r=".5"><stop stop-color="#34D399" stop-opacity="0.18"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/></radialGradient>
    <style>
      .fade { animation: fade .7s ease both; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      .dash { stroke-dasharray: 10 14; animation: dash 14s linear infinite; }
      .draw { stroke-dasharray: 1000; animation: draw 2.6s cubic-bezier(.4,0,.2,1) both; }
      .sweep { stroke-dasharray: 110 890; animation: sweep 7s linear infinite; }
      .scan { animation: scan 8s cubic-bezier(.6,0,.4,1) infinite; }
      @keyframes sweep { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
      @keyframes scan { 0% { transform: translateX(-420px); } 60%, 100% { transform: translateX(1620px); } }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes dash { to { stroke-dashoffset: -480; } }
      @keyframes draw { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
      .grow { transform-box: fill-box; transform-origin: left; animation: grow 3.6s ease-in-out infinite; } @keyframes grow { 50% { transform: scaleX(2.6); } }
    </style>
  </defs>
  <rect width="1200" height="96" rx="24" fill="#0B0E14"/>
  <rect width="1200" height="96" rx="24" fill="url(#grid)"/>
  <ellipse cx="120" cy="48" rx="260" ry="90" fill="url(#sg)"/>
  <text x="40" y="58" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="700" fill="#34D399" letter-spacing="1">01</text>
  <rect x="74" y="36" width="1" height="28" fill="#FFFFFF" fill-opacity="0.18"/>
  <text x="92" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#F0F6FC" letter-spacing="-0.5">Highlights</text>
  <text x="1160" y="57" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="600" fill="#8B949E" text-anchor="end" letter-spacing="1.6">THE SHORT VERSION</text>
  <rect class="grow" x="40" y="78" width="64" height="2" rx="1" fill="url(#acc)"/>
  <g clip-path="url(#clipAll)"><rect class="scan" x="-300" y="0" width="300" height="96" fill="url(#band)"/></g>
  <rect x=".5" y=".5" width="1199" height="95" rx="23.5" stroke="#FFFFFF" stroke-opacity="0.09"/>
  <text x="-9999" y="-9999" opacity="0" font-size="1">o5ws7f3a9e2b1c4d</text>
